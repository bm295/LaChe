name: Test and coverage

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - name: Run tests and print coverage
        run: npm run test:coverage
      - name: Publish coverage to job output
        run: |
          node <<'NODE'
          const { readFileSync, appendFileSync } = require('node:fs');

          const report = readFileSync('coverage/cobertura-coverage.xml', 'utf8');
          const lineRate = Number(report.match(/line-rate="([^"]+)"/)?.[1] ?? 0);
          const branchRate = Number(report.match(/branch-rate="([^"]+)"/)?.[1] ?? 0);
          const lineCoverage = (lineRate * 100).toFixed(2);
          const branchCoverage = (branchRate * 100).toFixed(2);

          console.log(`::notice title=Code coverage::Line: ${lineCoverage}% | Branch: ${branchCoverage}%`);
          appendFileSync(
            process.env.GITHUB_STEP_SUMMARY,
            `## Code coverage\n\n| Metric | Coverage |\n| --- | ---: |\n| Lines | ${lineCoverage}% |\n| Branches | ${branchCoverage}% |\n`,
          );
          NODE
